# Name of the Spring Boot application
spring.application.name=wiki-login

# Run the embedded Tomcat web server on port 8080
server.port=8080

# Thymeleaf template settings: prefix = folder, suffix = file extension
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Disable template cache so edited pages appear immediately while developing
spring.thymeleaf.cache=false
